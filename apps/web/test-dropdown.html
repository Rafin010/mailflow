<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-20">
  <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-xl flex flex-col" style="height: 400px; overflow-y: auto;">
    <form class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">First Name</label>
        <input type="text" class="w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm" placeholder="e.g. John" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Email Address</label>
        <input type="text" class="w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm" placeholder="username" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
        <input type="password" class="w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm" placeholder="Minimum 8 characters" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Role</label>
        <div class="relative">
          <button type="button" class="w-full bg-white border border-gray-300 rounded-md px-3 py-2.5 text-sm flex items-center justify-between text-left relative z-10" onclick="document.getElementById('dropdown').classList.toggle('hidden')">
            <span class="text-gray-900">User</span>
            <svg class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 9l6 6 6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          
          <div id="dropdown" class="absolute z-[100] w-full bottom-full mb-1 bg-white border border-gray-200 rounded-md shadow-lg py-1 max-h-60 overflow-auto">
            <div class="px-3 py-2 hover:bg-gray-50 flex items-start gap-2">
              <div class="mt-0.5 w-4 flex justify-center shrink-0"></div>
              <div>
                <div class="text-sm text-gray-900">User</div>
                <div class="text-xs text-gray-500 mt-0.5">Only has access to their mailbox.</div>
              </div>
            </div>
            <div class="px-3 py-2 hover:bg-gray-50 flex items-start gap-2">
              <div class="mt-0.5 w-4 flex justify-center shrink-0"></div>
              <div>
                <div class="text-sm text-gray-900">Admin</div>
                <div class="text-xs text-gray-500 mt-0.5">Can manage settings and users.</div>
              </div>
            </div>
            <div class="px-3 py-2 hover:bg-gray-50 flex items-start gap-2">
              <div class="mt-0.5 w-4 flex justify-center shrink-0"></div>
              <div>
                <div class="text-sm text-gray-900">Super Admin</div>
                <div class="text-xs text-gray-500 mt-0.5">Full access to all system features.</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</body>
</html>
