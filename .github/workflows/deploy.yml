name: Deploy RafMail

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install Dependencies
        run: cd apps/web && npm ci
      - name: Build Next.js
        run: cd apps/web && npm run build
      # Add deployment step for Vercel here

  build-and-deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: cd apps/api && pip install -r requirements.txt
      - name: Run Tests
        run: echo "No tests configured yet"
      - name: Build Docker Image
        run: docker build -t rafmail-api ./apps/api
      # Add deployment step for Azure/Render here
